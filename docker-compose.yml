services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    restart: unless-stopped

  ouroboros:
    build: .
    container_name: ouroboros-agent
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      OUROBOROS_SERVER_HOST: 0.0.0.0
      OUROBOROS_DATA_DIR: /ouroboros/data
      OUROBOROS_REPO_DIR: /ouroboros
      OUROBOROS_FILE_BROWSER_DEFAULT: /ouroboros
      TELEGRAM_STT_BACKEND: local
      TELEGRAM_STT_MODEL: ${TELEGRAM_STT_MODEL:-small}
      TELEGRAM_STT_LANGUAGE: ${TELEGRAM_STT_LANGUAGE:-ru}
      TELEGRAM_STT_DEVICE: ${TELEGRAM_STT_DEVICE:-auto}
      TELEGRAM_STT_COMPUTE_TYPE: ${TELEGRAM_STT_COMPUTE_TYPE:-auto}
      TELEGRAM_STT_MODEL_DIR: /ouroboros/data/models/faster-whisper
      TELEGRAM_STT_TIMEOUT_SEC: ${TELEGRAM_STT_TIMEOUT_SEC:-180}
      TRANSCRIPTION_MODEL_ROUTING: ${TRANSCRIPTION_MODEL_ROUTING:-duration}
      TRANSCRIPTION_MODEL_ROUTES: ${TRANSCRIPTION_MODEL_ROUTES:-1800:large-v3,*:turbo}
      TRANSCRIPTION_CPU_MODEL_ROUTES: ${TRANSCRIPTION_CPU_MODEL_ROUTES:-900:medium,*:small}
      TRANSCRIPTION_ALLOW_MODEL_FALLBACK: ${TRANSCRIPTION_ALLOW_MODEL_FALLBACK:-true}
      TRANSCRIPTION_CHUNK_SEC: ${TRANSCRIPTION_CHUNK_SEC:-900}
      TRANSCRIPTION_OVERLAP_SEC: ${TRANSCRIPTION_OVERLAP_SEC:-2}
      TRANSCRIPTION_MAX_DURATION_SEC: ${TRANSCRIPTION_MAX_DURATION_SEC:-43200}
      TRANSCRIPTION_MODEL_DIR: /ouroboros/data/models/faster-whisper
      OUROBOROS_AUDIO_UPLOAD_MAX_BYTES: ${OUROBOROS_AUDIO_UPLOAD_MAX_BYTES:-1073741824}

      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:6006/v1/traces"
      PHOENIX_PROJECT_NAME: "ouroboros-local"
      PHOENIX_PROTOCOL: "http/protobuf"
      PHOENIX_BATCH: "true"

    volumes:
      - ./data:/ouroboros/data
      - ./.knowledge:/ouroboros/.knowledge:ro
    depends_on:
      - phoenix
    restart: unless-stopped
    command:
      - telegram
      - --host
      - 0.0.0.0
      - --port
      - "8765"
